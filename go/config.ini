[app]
is_test=false
exchange=bitflyer
budget_criteria=500000 # 日本円がこの金額以下なら買い注文をしない
no_order_alert_days=3 # reconcileJobが「ボットの買い注文が0件」とみなしてアラートするまでの日数
balance_diff_threshold_btc=0.0005 # BTC残高とDB上の想定保有量の乖離を通知する閾値（最小取引単位0.001の半分）
balance_diff_threshold_eth=0.005 # ETH残高とDB上の想定保有量の乖離を通知する閾値（最小取引単位0.01の半分）
untracked_holding_btc=0 # DBが追跡していない既知のBTC保有量（過去の手動取引由来）。残高突合のベースラインとして想定保有量に加算する
untracked_holding_eth=0 # DBが追跡していない既知のETH保有量（過去の手動取引由来）。残高突合のベースラインとして想定保有量に加算する

[tradeSetting]
logfile_path=trading.log
product_code=BTC_JPY
trade_duration=1m
parallel_orders=100
trigger_time_01=06:30
trigger_time_02=06:45
trigger_time_03=18:00
trigger_time_04=06:00
trigger_time_05=05:30 # rolloverSellOrderJob（売り注文の27日ローリング）の実行時刻。Pi停止時間帯(01:30-02:45 JST)を避け、失効検出(06:05)より前
trigger_time_06=06:05 # expireSweepJob（失効検出）の実行時刻。Pi停止時間帯(01:30-02:45 JST)を避け、買い注文(06:30)より前
trigger_time_07=06:15 # reconcileJob（日次リコンサイル）の実行時刻。失効検出(06:05)の後・買い注文(06:30)の前
trigger_time_08=22:45 # cancelBuyOrderJob（買い注文の能動キャンセル）の実行時刻。Pi停止時間帯(01:30-02:45 JST)を避ける
trigger_time_09=01:20 # グレースフルシャットダウンの実行時刻。Pi停止(01:30 JST)の直前

[bitflyer]
max_buy_orders=28 # 未約定買い注文の上限。超過時は買い注文をスキップする
max_sell_orders=60 # 未約定売り注文の警告閾値。超過しても買い注文はブロックしない（Slack警告のみ）
buy_minute_to_expire=10080 # 買い注文の有効期限（分）。10080=7日
sell_minute_to_expire=43200 # 売り注文の有効期限（分）。43200=30日（Bitflyerの上限）
child_orders_count=500 # getchildordersの1回あたり取得件数（実効上限500）
buy_order_cancel_days=7 # cancelBuyOrderJobが未約定買い注文を能動キャンセルする経過日数（buy_minute_to_expireと整合）
expire_sweep_grace_minutes=10 # expireSweepJobが失効とみなすまでの猶予（分）。時計ずれ吸収用
sell_rollover_days_before_expire=3 # 売り注文の有効期限の何日前にローリングするか。30-3=27日目に巻き直す
sell_rollover_fallback_days=27 # expire_date未設定の旧売り注文をローリング対象とみなす経過日数
sell_rollover_max_per_run=20 # rolloverSellOrderJobが1回の実行で処理する上限件数（レート制限の歯止め）
btc_buy_amount_01=0.001
btc_buy_amount_02=0.001
btc_buy_amount_03=0.001
eth_buy_amount_01=0.01
eth_buy_amount_02=0.01
eth_buy_amount_03=0.01

[okex]
max_buy_orders=4
max_sell_orders=4
btc_buy_amount_01=0.003
btc_buy_amount_02=0.003
btc_buy_amount_03=0.003
eth_buy_amount_01=0.06
eth_buy_amount_02=0.06
eth_buy_amount_03=0.06

[db]
name=crypto_trading
driver=mysql

[web]
port=8080
